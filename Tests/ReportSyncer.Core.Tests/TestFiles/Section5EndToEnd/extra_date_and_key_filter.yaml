## Extra: Combined date + key filter on Child.
version: "1.0"
run:
  dryRun: false
  defaultBatchSize: 500
  deleteChunkSize: 200
  useTvpIfAvailable: true
safety:
  forbidProdToProd: false
  requireDifferentConnections: false
  confirmLargeDeletePct: 0.80
schemaPolicy:
  onMismatch: "Fail"
  requirePrimaryKey: true
  allowExtraTargetColumns: true
connections:
  - name: "LocalSource"
    connectionString: "(localdb)\\MSSQLLocalDB;Database=ReportSyncerTest;Trusted_Connection=True;"
    environment: "Dev"
    type: "Reporting"
  - name: "LocalTarget"
    connectionString: "(localdb)\\MSSQLLocalDB;Database=ReportSyncerTest;Trusted_Connection=True;"
    environment: "Dev"
    type: "Reporting"
syncJobs:
  - name: "extra_date_and_key_filter"
    sourceConnection: "LocalSource"
    targetConnection: "LocalTarget"
    parameters:
      ParentId: 1
      StartDate: "2025-01-01"
      EndDate: "2025-01-31"
    tables:
      - source: "rs_src.Child"
        target: "rs_tgt.Child"
        enabled: true
        preSyncTargetAction: true
        allowAllDelete: false
        filter:
          keyColumn: "ParentId"
          value: "{ParentId}"
          dateColumn: "CreatedOn"
          startDate: "{StartDate}"
          endDate: "{EndDate}"
        columnMapping:
          automapByName: true
