## IT3: FK ordering - Parent deletes/inserts must bracket Child to avoid FK violations.
version: "1.0"
run:
  dryRun: false
  defaultBatchSize: 500
  deleteChunkSize: 200
  useTvpIfAvailable: true
safety:
  forbidProdToProd: false
  requireDifferentConnections: false
  confirmLargeDeletePct: 0.80
schemaPolicy:
  onMismatch: "Fail"
  requirePrimaryKey: true
  allowExtraTargetColumns: true
connections:
  - name: "LocalSource"
    connectionString: 'Server=(localdb)\MSSQLLocalDB;Initial Catalog=ReportSyncerTest;Integrated Security=True;'
    environment: "Dev"
    type: "Reporting"
  - name: "LocalTarget"
    connectionString: 'Server=(localdb)\MSSQLLocalDB;Initial Catalog=ReportSyncerTest;Integrated Security=True;'
    environment: "Dev"
    type: "Reporting"
syncJobs:
  - name: "it3_fk_ordering_parent_child"
    sourceConnection: "LocalSource"
    targetConnection: "LocalTarget"
    parameters:
      ParentBizKey: "P-1"
      ParentId: 1
    tables:
      - source: "rs_src.Parent"
        target: "rs_tgt.Parent"
        enabled: true
        preSyncTargetAction: true
        allowAllDelete: false
        enableIdentityInsert: true
        filter:
          keyColumn: "BizKey"
          value: "P-1"
        columnMapping:
          automapByName: true
      - source: "rs_src.Child"
        target: "rs_tgt.Child"
        enabled: true
        preSyncTargetAction: true
        allowAllDelete: false
        enableIdentityInsert: true
        filter:
          keyColumn: "ParentId"
          value: 1
        columnMapping:
          automapByName: true








