## Extra: PreSyncTargetAction toggle comparison (Parent vs Child).
version: "1.0"
run:
  dryRun: false
  defaultBatchSize: 500
  deleteChunkSize: 200
  useTvpIfAvailable: true
safety:
  forbidProdToProd: false
  requireDifferentConnections: false
  confirmLargeDeletePct: 0.80
schemaPolicy:
  onMismatch: "Fail"
  requirePrimaryKey: true
  allowExtraTargetColumns: true
connections:
  - name: "LocalSource"
    connectionString: 'Server=(localdb)\MSSQLLocalDB;Initial Catalog=ReportSyncerTest;Integrated Security=True;'
    environment: "Dev"
    type: "Reporting"
  - name: "LocalTarget"
    connectionString: 'Server=(localdb)\MSSQLLocalDB;Initial Catalog=ReportSyncerTest;Integrated Security=True;'
    environment: "Dev"
    type: "Reporting"
syncJobs:
  - name: "extra_presync_toggle"
    sourceConnection: "LocalSource"
    targetConnection: "LocalTarget"
    parameters:
      ParentBizKey: "P-3"
      ParentId: 3
    tables:
      - source: "rs_src.Parent"
        target: "rs_tgt.Parent"
        enabled: true
        preSyncTargetAction: true
        allowAllDelete: false
        enableIdentityInsert: true
        filter:
          keyColumn: "BizKey"
          value: "{ParentBizKey}"
        columnMapping:
          automapByName: true
      - source: "rs_src.Child"
        target: "rs_tgt.Child"
        enabled: true
        preSyncTargetAction: true
        allowAllDelete: false
        enableIdentityInsert: false
        filter:
          keyColumn: "ParentId"
          value: "{ParentId}"
        columnMapping:
          automapByName: false
          mappings:
            ChildId:
              ignore: true
            ParentId:
              fromSource: "ParentId"
            LineCode:
              fromSource: "LineCode"
            Amount:
              fromSource: "Amount"
            CreatedOn:
              fromSource: "CreatedOn"








