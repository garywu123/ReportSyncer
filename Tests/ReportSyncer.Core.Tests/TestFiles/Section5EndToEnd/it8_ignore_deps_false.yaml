## IT8: ignoreDependencies=false causes preflight failure when parent missing.
version: "1.0"
run:
  dryRun: true
  defaultBatchSize: 500
  deleteChunkSize: 200
  useTvpIfAvailable: true
safety:
  forbidProdToProd: false
  requireDifferentConnections: false
  confirmLargeDeletePct: 0.80
schemaPolicy:
  onMismatch: "Fail"
  requirePrimaryKey: true
  allowExtraTargetColumns: true
connections:
  - name: "LocalSource"
    connectionString: 'Server=(localdb)\MSSQLLocalDB;Initial Catalog=ReportSyncerTest;Integrated Security=True;'
    environment: "Dev"
    type: "Reporting"
  - name: "LocalTarget"
    connectionString: 'Server=(localdb)\MSSQLLocalDB;Initial Catalog=ReportSyncerTest;Integrated Security=True;'
    environment: "Dev"
    type: "Reporting"
syncJobs:
  - name: "it8_ignore_dependencies_false"
    sourceConnection: "LocalSource"
    targetConnection: "LocalTarget"
    tables:
      - source: "rs_src.Child"
        target: "rs_tgt.Child"
        enabled: true
        preSyncTargetAction: true
        allowAllDelete: false
        ignoreDependencies: false
        filter:
          keyColumn: "ParentId"
          value: 999999  # parent expected missing
        columnMapping:
          automapByName: true








