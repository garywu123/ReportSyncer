# unsupported top-level property (`unknownTopLevel`). The test
# `LoadAsync_WithUnknownTopLevelKey_ThrowsConfigurationException` expects
# the configuration loader to detect and surface this as a
# `ConfigurationException` rather than silently ignore it.
version: '1.0'
run:
  dryRun: true
connections:
  - name: Src
    type: Application
    connectionString: 'Server=(local);Database=Test;Integrated Security=true'
  - name: Tgt
    type: Application
    connectionString: 'Server=(local);Database=Test;Integrated Security=true'
syncJobs:
  - name: Job1
    tables: []

# Unknown top-level key that should cause the loader to fail
unknownTopLevel: unexpected
